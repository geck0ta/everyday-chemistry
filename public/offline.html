<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Everyday Chemistry</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: ui-monospace, "JetBrains Mono", monospace;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 13px; line-height: 1.7; color: #8b949e; margin: 0 0 20px; }
    .flask { font-size: 48px; }
    a {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 999px;
      background: #34e0a1;
      color: #0d1117;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="flask">⚗️</div>
    <h1>Kamu sedang offline</h1>
    <p>
      Halaman ini belum pernah dibuka sebelumnya, jadi belum tersimpan di perangkat.
      Buka halaman yang sudah pernah dikunjungi — itu tetap bisa diakses tanpa internet.
    </p>
    <a href="./">Kembali ke beranda</a>
  </div>
</body>
</html>
